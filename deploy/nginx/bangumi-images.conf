# My9 Bangumi image proxy, adapted from Yuri-NagaSaki/bangumi-proxy.
# Install as /etc/nginx/conf.d/bangumi-images.conf.
# Update the allow list when https://www.cloudflare.com/ips/ changes.
map $http_referer $bangumi_allowed_referer {
    default 0;
    ~*^https?://(?:[a-z0-9-]+\.)*shatranj\.space(?::[0-9]+)?(?:/|$) 1;
}

map $http_origin $bangumi_allowed_origin {
    default 0;
    "" 1;
    ~*^https?://(?:[a-z0-9-]+\.)*shatranj\.space(?::[0-9]+)?$ 1;
}

map $http_origin $bangumi_cors_origin {
    default "";
    ~*^https?://(?:[a-z0-9-]+\.)*shatranj\.space(?::[0-9]+)?$ $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name bgm-pic.shatranj.space;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bgm-pic.shatranj.space;

    ssl_certificate /etc/nginx/ssl/cloudflare.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare.key;
    access_log /var/log/nginx/bangumi-images.access.log combined buffer=32k flush=1m;

    # Only image paths on the two known Bangumi hosts can reach upstream.
    location ~ ^/(?<bangumi_image_host>lain|img)(?<bangumi_image_path>/pic/.+)$ {
        # My9 generates canonical URLs without a query string. Reject cache-busting variants.
        if ($args != "") { return 404; }
        if ($bangumi_allowed_referer = 0) { return 403; }
        if ($bangumi_allowed_origin = 0) { return 403; }

        allow 173.245.48.0/20;
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 141.101.64.0/18;
        allow 108.162.192.0/18;
        allow 190.93.240.0/20;
        allow 188.114.96.0/20;
        allow 197.234.240.0/22;
        allow 198.41.128.0/17;
        allow 162.158.0.0/15;
        allow 104.16.0.0/13;
        allow 104.24.0.0/14;
        allow 172.64.0.0/13;
        allow 131.0.72.0/22;
        allow 2400:cb00::/32;
        allow 2606:4700::/32;
        allow 2803:f800::/32;
        allow 2405:b500::/32;
        allow 2405:8100::/32;
        allow 2a06:98c0::/29;
        allow 2c0f:f248::/32;
        deny all;

        limit_except GET { deny all; }

        resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
        # img.bgm.tv no longer resolves; its legacy /pic/ URLs use lain.bgm.tv.
        set $bangumi_upstream lain.bgm.tv;
        proxy_pass https://$bangumi_upstream$bangumi_image_path;
        proxy_set_header Host $bangumi_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $bangumi_upstream;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-Ray "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_ignore_headers Set-Cookie;

        proxy_connect_timeout 8s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_max_temp_file_size 0;

        add_header Access-Control-Allow-Origin $bangumi_cors_origin always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Vary "Origin, Referer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000, immutable";
        # Every request must reach the Referer/Origin guard. Browsers may cache locally.
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
